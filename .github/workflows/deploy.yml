name: Deploy to GitHub Pages
# Managed by dsa-ntc

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Java (for ClojureScript)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: latest

      - name: Cache Maven & Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-cljdeps-${{ hashFiles('deps.edn', 'shadow-cljs.edn') }}
          restore-keys: |
            ${{ runner.os }}-cljdeps-

      # Workaround: Aether on GitHub runners fails to resolve
      # com.fasterxml:oss-parent:38 (a transitive parent POM via jackson-core
      # 2.10.2) even though Maven Central serves it. Copy a vendored copy
      # into ~/.m2/repository so the resolver finds it on disk.
      - name: Pre-seed vendored Maven artifacts
        run: |
          set -euo pipefail
          mkdir -p ~/.m2/repository
          cp -Rv vendor/m2/. ~/.m2/repository/
          ls -l ~/.m2/repository/com/fasterxml/oss-parent/38/

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          R2_DATA_URL: ${{ secrets.R2_DATA_URL }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::Build attempt $attempt"
            if npm run build; then
              echo "::endgroup::"
              echo "Build succeeded on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "Build attempt $attempt failed"
            if [ $attempt -lt 3 ]; then
              sleep_seconds=$((attempt * 15))
              echo "Sleeping ${sleep_seconds}s before retry..."
              sleep $sleep_seconds
            fi
          done
          echo "Build failed after 3 attempts"
          exit 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
